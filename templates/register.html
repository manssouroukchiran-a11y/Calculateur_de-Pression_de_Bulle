<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thermo App — Inscription</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c10;
    --panel: #111318;
    --border: #1e2230;sss
    --accent: #00e5ff;
    --accent2: #ff6b35;
    --text: #e8eaf0;
    --muted: #5a6080;
    --success: #00e676;
    --error: #ff3d5a;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    position: relative;
    overflow: hidden;
  }

  .grid-bg {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,229,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .glow-orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(100px);
    opacity: 0.1;
    pointer-events: none;
  }
  .orb1 { width: 500px; height: 500px; background: var(--accent); top: -200px; right: -100px; }
  .orb2 { width: 400px; height: 400px; background: var(--accent2); bottom: -150px; left: -100px; }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 48px;
    width: 100%;
    max-width: 520px;
    position: relative;
    z-index: 2;
    animation: fadeUp 0.5s ease forwards;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 20%; right: 20%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card-header { margin-bottom: 36px; display: flex; align-items: flex-start; justify-content: space-between; }

  .card-header h2 { font-size: 1.8rem; font-weight: 800; }
  .card-header p {
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    color: var(--muted);
    margin-top: 6px;
  }

  .back-link {
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    color: var(--muted);
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .back-link:hover { border-color: var(--accent); color: var(--accent); }

  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

  .form-group { margin-bottom: 18px; }

  label {
    display: block;
    font-family: 'Space Mono', monospace;
    font-size: 0.68rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.15em;
    margin-bottom: 8px;
  }

  input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 13px 16px;
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 0.82rem;
    outline: none;
    transition: all 0.2s;
  }

  input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(0,229,255,0.08);
  }

  input::placeholder { color: var(--muted); }

  .btn {
    width: 100%;
    padding: 15px;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    color: #000;
    font-family: 'Syne', sans-serif;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: all 0.2s;
    margin-top: 8px;
    position: relative;
    overflow: hidden;
  }

  .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 25px rgba(0,229,255,0.35); }

  .alert {
    padding: 12px 16px;
    border-radius: 8px;
    font-family: 'Space Mono', monospace;
    font-size: 0.72rem;
    margin-bottom: 20px;
    border: 1px solid;
    line-height: 1.5;
  }

  .alert-error { background: rgba(255,61,90,0.08); border-color: rgba(255,61,90,0.25); color: var(--error); }
  .alert-success { background: rgba(0,230,118,0.08); border-color: rgba(0,230,118,0.25); color: var(--success); }

  .form-footer {
    text-align: center;
    margin-top: 24px;
    font-family: 'Space Mono', monospace;
    font-size: 0.72rem;
    color: var(--muted);
  }

  .form-footer a { color: var(--accent); text-decoration: none; }
  .form-footer a:hover { opacity: 0.7; }

  @media (max-width: 500px) {
    .card { padding: 32px 24px; }
    .row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="grid-bg"></div>
<div class="glow-orb orb1"></div>
<div class="glow-orb orb2"></div>

<div class="card">
  <div class="card-header">
    <div>
      <h2>Créer un compte</h2>
      <p>// Rejoindre ThermoApp</p>
    </div>
    <a href="/login" class="back-link">← Retour</a>
  </div>

  {% if erreur %}
  <div class="alert alert-error">⚠ {{ erreur }}</div>
  {% endif %}

  {% if success %}
  <div class="alert alert-success">{{ success }}</div>
  {% endif %}

  <form method="POST">
    <div class="row">
      <div class="form-group">
        <label>Prénom</label>
        <input type="text" name="fname" placeholder="Ahmed" required>
      </div>
      <div class="form-group">
        <label>Nom d'utilisateur</label>
        <input type="text" name="username" placeholder="ahmed99" required>
      </div>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" name="email" placeholder="ahmed@gmail.com" required>
    </div>
    <div class="row">
      <div class="form-group">
        <label>Mot de passe</label>
        <input type="password" name="password" placeholder="••••••••" required>
      </div>
      <div class="form-group">
        <label>Confirmer</label>
        <input type="password" name="confirm" placeholder="••••••••" required>
      </div>
    </div>
    <button type="submit" class="btn">CRÉER MON COMPTE →</button>
  </form>

  <div class="form-footer">
    Déjà un compte ? <a href="/login">Se connecter</a>
  </div>
</div>

</body>
</html>
